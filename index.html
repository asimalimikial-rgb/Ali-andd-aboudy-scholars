<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#4A90E2">
<title>Ali and Aboudy Scholars — Learning Adventure</title>
<style>
  :root{
    --primary:#4A90E2;--primary-dark:#2E6BB8;--secondary:#FFB84D;
    --success:#5CB85C;--danger:#E87C7C;--bg:#FFF8EC;--card:#FFFFFF;
    --text:#2C3E50;--text-light:#6C7A89;--shadow:0 4px 12px rgba(0,0,0,.08);
    --radius:18px;--radius-lg:24px;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  input,button{font:inherit}
  html,body{height:100%;overflow:hidden}
  body{
    font-family:'Comic Sans MS','Chalkboard SE','Trebuchet MS',system-ui,sans-serif;
    background:linear-gradient(135deg,#FFF8EC 0%,#FFE8C4 100%);
    color:var(--text);user-select:none;-webkit-user-select:none;overscroll-behavior:none;
  }
  #app{height:100%;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}
  .screen{flex:1;overflow-y:auto;padding:16px;padding-bottom:80px;animation:fadeIn .3s}
  @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes pop{0%{transform:scale(.8)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
  @keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  @keyframes wiggle{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
  @keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(100vh) rotate(720deg);opacity:0}}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
  .hidden{display:none!important}
  .topbar{
    background:var(--primary);color:#fff;padding:12px 16px;display:flex;
    align-items:center;justify-content:space-between;box-shadow:var(--shadow);
    position:sticky;top:0;z-index:50;
  }
  .topbar h1{font-size:1.1rem;font-weight:700}
  .topbar .back-btn,.icon-btn{
    background:rgba(255,255,255,.2);border:none;color:#fff;width:40px;height:40px;
    border-radius:50%;font-size:1.2rem;cursor:pointer;display:flex;align-items:center;justify-content:center;
  }
  .topbar .actions{display:flex;gap:8px}
  .welcome{text-align:center;padding:20px 16px}
  .welcome h2{font-size:1.6rem;color:var(--primary-dark);margin-bottom:8px}
  .welcome p{color:var(--text-light);font-size:1rem;margin-bottom:20px}
  .book-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;padding:8px}
  .book-card{
    background:var(--card);border-radius:var(--radius-lg);padding:18px;box-shadow:var(--shadow);
    cursor:pointer;transition:transform .2s;text-align:center;border:3px solid transparent;
  }
  .book-card:active{transform:scale(.96)}
  .book-card:hover{transform:translateY(-3px)}
  .book-icon{font-size:3rem;margin-bottom:8px;display:block}
  .book-title{font-size:1rem;font-weight:700;margin-bottom:4px}
  .book-level{font-size:.8rem;color:var(--text-light);margin-bottom:10px}
  .progress-bar{height:8px;background:#eee;border-radius:4px;overflow:hidden;margin-top:8px}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--success),#7ED97E);transition:width .4s}
  .progress-text{font-size:.75rem;color:var(--text-light);margin-top:4px}
  .book-card.kg2-eng{border-color:#FFB84D}
  .book-card.kg2-math{border-color:#4A90E2}
  .book-card.g2-eng{border-color:#9B59B6}
  .book-card.g2-math{border-color:#E74C3C}
  .book-card.g2-sci{border-color:#27AE60}
  .units-list{padding:8px}
  .unit-card{
    background:var(--card);border-radius:var(--radius);padding:14px;margin-bottom:12px;
    box-shadow:var(--shadow);cursor:pointer;display:flex;align-items:center;gap:12px;
  }
  .unit-card:active{transform:scale(.98)}
  .unit-icon{font-size:2rem;flex-shrink:0}
  .unit-info{flex:1;min-width:0}
  .unit-title{font-weight:700;font-size:1rem;margin-bottom:4px}
  .unit-desc{font-size:.85rem;color:var(--text-light)}
  .unit-status{
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;
    justify-content:center;font-size:1.1rem;flex-shrink:0;
  }
  .status-done{background:var(--success);color:#fff}
  .status-progress{background:var(--secondary);color:#fff}
  .status-new{background:#eee;color:var(--text-light)}
  .lesson-container{padding:12px;max-width:700px;margin:0 auto}
  .lesson-header{text-align:center;margin-bottom:16px}
  .lesson-title{font-size:1.3rem;color:var(--primary-dark);margin-bottom:6px}
  .lesson-goal{
    background:#fff;border-radius:var(--radius);padding:10px 14px;font-size:.9rem;
    color:var(--text-light);box-shadow:var(--shadow);display:inline-block;
  }
  .lesson-progress{height:10px;background:#eee;border-radius:5px;margin:14px 0;overflow:hidden}
  .lesson-progress-fill{height:100%;background:var(--primary);transition:width .4s}
  .character-wrap{display:flex;justify-content:center;align-items:center;margin:10px 0;position:relative;height:140px}
  .character{width:120px;height:120px;position:relative;animation:bounce 3s ease-in-out infinite}
  .character-body{
    width:100px;height:100px;background:#FFD93D;border-radius:50%;
    position:absolute;left:10px;top:10px;box-shadow:inset -8px -8px 0 rgba(0,0,0,.08);
  }
  .character-eye{width:14px;height:18px;background:#2C3E50;border-radius:50%;position:absolute;top:35px}
  .character-eye.left{left:28px}
  .character-eye.right{right:28px}
  .character-eye.happy{height:6px;border-radius:0 0 10px 10px;top:40px}
  .character-mouth{
    width:30px;height:15px;border:3px solid #2C3E50;border-top:none;
    border-radius:0 0 30px 30px;position:absolute;bottom:28px;left:50%;transform:translateX(-50%);
  }
  .character-mouth.happy{height:20px}
  .character-mouth.sad{border:3px solid #2C3E50;border-bottom:none;border-radius:30px 30px 0 0;height:10px;bottom:32px}
  .character-mouth.thinking{width:12px;height:12px;border-radius:50%;border:3px solid #2C3E50;background:#FF6B9D;bottom:32px}
  .character-cheek{width:14px;height:8px;background:#FF9AAE;border-radius:50%;position:absolute;top:52px;opacity:.7}
  .character-cheek.left{left:14px}
  .character-cheek.right{right:14px}
  .speech-bubble{
    background:#fff;border-radius:var(--radius);padding:12px 16px;box-shadow:var(--shadow);
    position:absolute;max-width:240px;font-size:.95rem;text-align:center;bottom:-10px;right:-30px;animation:pop .3s;
  }
  .speech-bubble::before{content:'';position:absolute;left:-8px;bottom:15px;width:0;height:0;border:8px solid transparent;border-right-color:#fff}
  .activity-area{background:var(--card);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow);margin:16px 0;min-height:200px}
  .instruction{font-size:1.1rem;text-align:center;margin-bottom:16px;font-weight:600}
  .listen-btn{
    background:var(--secondary);color:#fff;border:none;border-radius:50%;
    width:56px;height:56px;font-size:1.6rem;cursor:pointer;box-shadow:var(--shadow);
    margin:0 auto 12px;display:block;
  }
  .listen-btn:active{transform:scale(.92)}
  .listen-btn.playing{animation:wiggle .5s infinite}
  .options-grid{display:grid;gap:12px;margin-top:12px}
  .options-grid.cols-2{grid-template-columns:1fr 1fr}
  .options-grid.cols-3{grid-template-columns:repeat(3,1fr)}
  .options-grid.cols-4{grid-template-columns:repeat(2,1fr)}
  @media(min-width:500px){.options-grid.cols-4{grid-template-columns:repeat(4,1fr)}}
  .option-btn{
    background:#fff;border:3px solid #E0E6ED;border-radius:var(--radius);
    padding:16px 10px;font-size:1.1rem;font-weight:600;cursor:pointer;
    transition:all .2s;font-family:inherit;min-height:64px;
    display:flex;align-items:center;justify-content:center;text-align:center;
  }
  .option-btn:active{transform:scale(.95)}
  .option-btn.correct{border-color:var(--success);background:#E8F8E8;animation:pop .3s}
  .option-btn.incorrect{border-color:var(--danger);background:#FDE8E8}
  .option-btn .emoji{font-size:2rem;display:block;margin-bottom:4px}
  .counting-area{
    display:flex;flex-wrap:wrap;gap:8px;justify-content:center;
    padding:16px;background:#F8F9FA;border-radius:var(--radius);min-height:120px;
  }
  .count-object{font-size:2rem;cursor:pointer;transition:transform .2s}
  .count-object:active{transform:scale(1.2)}
  .count-object.counted{transform:scale(1.3);filter:drop-shadow(0 0 6px var(--secondary))}
  .number-pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
  .num-btn{
    background:#fff;border:2px solid #BDC3C7;border-radius:12px;padding:14px 0;
    font-size:1.3rem;font-weight:700;cursor:pointer;font-family:inherit;
  }
  .num-btn:active{background:var(--primary);color:#fff}
  .feedback{text-align:center;padding:14px;border-radius:var(--radius);margin-top:12px;font-size:1rem;font-weight:600;animation:pop .3s}
  .feedback.correct{background:#E8F8E8;color:#2D7A2D}
  .feedback.incorrect{background:#FDE8E8;color:#A83232}
  .feedback.hint{background:#FFF4D6;color:#8B6914}
  .btn{
    background:var(--primary);color:#fff;border:none;border-radius:var(--radius);
    padding:14px 24px;font-size:1rem;font-weight:700;cursor:pointer;font-family:inherit;
    box-shadow:var(--shadow);
  }
  .btn:active{transform:scale(.96)}
  .btn.secondary{background:var(--secondary)}
  .btn.success{background:var(--success)}
  .btn.ghost{background:transparent;color:var(--primary);border:2px solid var(--primary);box-shadow:none}
  .btn-row{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
  .confetti-container{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1000}
  .confetti-piece{position:absolute;width:10px;height:10px;top:-20px;animation:confetti 2s linear forwards}
  .parent-gate{padding:30px;text-align:center;max-width:400px;margin:40px auto;background:var(--card);border-radius:var(--radius-lg);box-shadow:var(--shadow)}
  .parent-gate h2{margin-bottom:12px;color:var(--primary-dark)}
  .parent-gate input{
    width:100%;padding:12px;border:2px solid #E0E6ED;border-radius:12px;
    font-size:1.1rem;text-align:center;margin:12px 0;font-family:inherit;
  }
  .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin:16px 0}
  .stat-card{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow)}
  .stat-value{font-size:1.8rem;font-weight:700;color:var(--primary-dark)}
  .stat-label{font-size:.85rem;color:var(--text-light);margin-top:4px}
  .settings-section{background:var(--card);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
  .settings-section h3{margin-bottom:10px;color:var(--primary-dark);font-size:1.1rem}
  .setting-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F0F0F0}
  .setting-row:last-child{border:none}
  .toggle{width:50px;height:28px;background:#ccc;border-radius:14px;position:relative;cursor:pointer;transition:background .2s}
  .toggle.on{background:var(--success)}
  .toggle::after{content:'';width:22px;height:22px;background:#fff;border-radius:50%;position:absolute;top:3px;left:3px;transition:left .2s;box-shadow:0 2px 4px rgba(0,0,0,.2)}
  .toggle.on::after{left:25px}
  .diag-item{background:#F8F9FA;border-radius:8px;padding:8px 12px;margin:4px 0;font-size:.85rem;display:flex;justify-content:space-between}
  .diag-pass{color:var(--success);font-weight:700}
  .diag-fail{color:var(--danger);font-weight:700}
  .story-text{background:#FFF9E6;border-left:4px solid var(--secondary);padding:14px;border-radius:8px;font-size:1.05rem;line-height:1.6;margin:12px 0}
  .letter-display{
    font-size:5rem;font-weight:700;text-align:center;color:var(--primary-dark);
    padding:20px;background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);
    margin:12px 0;text-transform:lowercase;
  }
  .word-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
  .word-tile{background:#fff;border:2px solid var(--primary);border-radius:10px;padding:10px 16px;font-size:1rem;font-weight:600;cursor:pointer;color:var(--primary)}
  .word-tile.used{opacity:.3;pointer-events:none}
  .sentence-slots{min-height:60px;background:#F8F9FA;border-radius:var(--radius);padding:10px;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0;border:2px dashed #BDC3C7}
  .sentence-slot{background:var(--primary);color:#fff;padding:8px 14px;border-radius:10px;font-weight:600;cursor:pointer}
  .bottom-nav{
    position:fixed;bottom:0;left:0;right:0;background:#fff;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);display:flex;justify-content:space-around;
    padding:8px 0 max(8px,env(safe-area-inset-bottom));z-index:40;max-width:1200px;margin:0 auto;
  }
  .nav-btn{background:none;border:none;padding:8px 12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--text-light);font-family:inherit;font-size:.7rem}
  .nav-btn.active{color:var(--primary)}
  .nav-btn .nav-icon{font-size:1.5rem}
  /* Drag and Drop */
  .drag-container{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;margin:16px 0}
  .drag-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px;background:#F8F9FA;border-radius:var(--radius);min-height:80px;min-width:150px}
  .drop-zone{
    min-width:100px;min-height:100px;border:3px dashed #BDC3C7;border-radius:var(--radius);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:10px;background:#fff;transition:all .2s;
  }
  .drop-zone.over{border-color:var(--primary);background:#E8F2FF;transform:scale(1.05)}
  .drop-zone.filled{border-style:solid;border-color:var(--success);background:#E8F8E8}
  .drop-zone-label{font-size:.85rem;color:var(--text-light);margin-bottom:6px;font-weight:600}
  .drop-zone-content{font-size:2rem;min-height:40px;display:flex;align-items:center;justify-content:center}
  .drag-item{
    background:#fff;border:2px solid var(--primary);border-radius:12px;
    padding:10px 14px;font-size:1.8rem;cursor:grab;box-shadow:var(--shadow);
    touch-action:none;transition:transform .1s;
  }
  .drag-item.dragging{opacity:.5;cursor:grabbing}
  .drag-item.placed{opacity:.3;pointer-events:none}
  /* Pattern */
  .pattern-row{display:flex;gap:8px;justify-content:center;align-items:center;flex-wrap:wrap;margin:16px 0}
  .pattern-cell{
    width:60px;height:60px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:2rem;background:#fff;border:2px solid #E0E6ED;
  }
  .pattern-cell.missing{border:3px dashed var(--secondary);background:#FFF8EC}
  /* Tracing canvas */
  .trace-container{text-align:center;margin:12px 0}
  .trace-canvas{
    border:3px solid var(--primary);border-radius:var(--radius);
    background:#fff;touch-action:none;max-width:100%;
  }
  .trace-controls{display:flex;gap:8px;justify-content:center;margin-top:12px}
  /* Badges */
  .badges-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:12px;margin:12px 0}
  .badge{
    background:#fff;border-radius:var(--radius);padding:12px;text-align:center;
    box-shadow:var(--shadow);border:2px solid #eee;
  }
  .badge.earned{border-color:var(--secondary);background:linear-gradient(135deg,#FFF8DC,#FFE8A0)}
  .badge.locked{opacity:.4;filter:grayscale(1)}
  .badge-icon{font-size:2.5rem;display:block;margin-bottom:4px}
  .badge-name{font-size:.75rem;font-weight:600;color:var(--text)}
  /* Sorting */
  .sort-items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
  .sort-item{
    background:#fff;border:2px solid #BDC3C7;border-radius:var(--radius);
    padding:10px;font-size:1.5rem;cursor:pointer;min-width:60px;text-align:center;
    transition:all .2s;
  }
  .sort-item.selected{border-color:var(--primary);background:#E8F2FF;transform:scale(1.05)}
  .sort-item.correct{border-color:var(--success);background:#E8F8E8}
  .sort-item.incorrect{border-color:var(--danger);background:#FDE8E8}
  /* Clock */
  .clock-container{text-align:center;margin:16px 0}
  .clock-svg{max-width:220px;margin:0 auto;display:block}
  /* Memory */
  .memory-grid{display:grid;gap:8px;justify-content:center;margin:12px auto;max-width:400px}
  .memory-card{
    aspect-ratio:1;background:var(--primary);border-radius:12px;display:flex;
    align-items:center;justify-content:center;font-size:1.8rem;cursor:pointer;
    color:transparent;transition:all .3s;
  }
  .memory-card.flipped{background:#fff;color:var(--text);border:2px solid var(--primary)}
  .memory-card.matched{background:#E8F8E8;border:2px solid var(--success);color:var(--text)}
  @media(max-width:380px){
    .book-grid{grid-template-columns:repeat(2,1fr);gap:10px}
    .book-icon{font-size:2.3rem}
    .book-title{font-size:.9rem}
    .instruction{font-size:1rem}
  }
  @media(min-width:768px){.screen{padding:24px}.book-grid{grid-template-columns:repeat(3,1fr)}}
  @media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* Local bilingual learning helper */
#ls-helper-launch{position:fixed;right:14px;bottom:88px;z-index:9000;border:0;border-radius:999px;padding:12px 16px;background:#6b4fc7;color:#fff;font-weight:700;box-shadow:0 4px 14px #0003;cursor:pointer}
#ls-helper-panel{position:fixed;inset:0;z-index:9100;background:#14203388;display:none;align-items:flex-end;justify-content:center;padding:12px}
#ls-helper-panel.open{display:flex}
#ls-helper-card{width:min(560px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:22px;padding:18px;box-shadow:0 10px 40px #0004;color:#243247}
#ls-helper-card h2{margin:0 0 8px;color:#4c3a9b}#ls-helper-card p{line-height:1.6;margin:8px 0}
#ls-helper-card button{border:0;border-radius:12px;padding:10px 13px;margin:5px;background:#eee;cursor:pointer;font:inherit}
#ls-helper-card .primary{background:#5d50b5;color:white}#ls-helper-input{width:100%;padding:12px;border:1px solid #bbb;border-radius:10px;font:inherit;margin-top:8px}
#ls-helper-answer{background:#f3f0ff;padding:12px;border-radius:12px;margin-top:10px;white-space:pre-wrap}
.ai-page{max-width:820px;margin:0 auto}.ai-card{background:#fff;border-radius:var(--radius-lg);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.ai-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.ai-status{border:1px solid #e2e6ed;border-radius:14px;padding:14px;background:#fff}
.ai-status h3{margin:0 0 6px;color:var(--primary-dark)}.ai-status p,.ai-note{font-size:.85rem;color:var(--text-light);line-height:1.5}
.ai-page label{display:block;font-weight:700;margin:10px 0 5px}.ai-page input[type=url],.ai-page input[type=text],.ai-page input[type=password]{width:100%;padding:11px;border:2px solid #e0e6ed;border-radius:10px;font:inherit}
.ai-toggle{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid #eee}.ai-toggle input{margin-top:5px;width:20px;height:20px;flex:none}
.ai-message{min-height:24px;margin-top:8px;color:var(--primary-dark);font-weight:700}.ai-state{font-weight:800}.ai-state.connected,.ai-state.configured{color:#287a42}.ai-state.quota-exhausted,.ai-state.error,.ai-state.not-configured{color:#a54646}
body.ai-settings-open #ls-helper-launch{display:none}
@media(max-width:520px){#ls-helper-launch{right:10px;bottom:82px;padding:10px 13px}.ai-grid{grid-template-columns:1fr}.ai-card{padding:13px}}

</style>
</head>
<body>
<div id="app"></div>
<button id="ls-helper-launch" type="button" onclick="LSHelper.open()">💡 Help / مساعدة</button>
<div id="ls-helper-panel" role="dialog" aria-modal="true" aria-labelledby="ls-helper-title" onclick="if(event.target===this)LSHelper.close()">
 <div id="ls-helper-card"><button style="float:right" onclick="LSHelper.close()" aria-label="Close">✕</button>
   <h2 id="ls-helper-title">Ali and Aboudy Scholars Helper 🌟</h2>
  <p id="ls-helper-context">I can help you think step by step.</p>
  <div style="display:flex;flex-wrap:wrap;gap:4px">
   <button class="primary" onclick="LSHelper.explain()">اشرح لي بالعربي</button>
   <button onclick="LSHelper.simpleEnglish()">Easy English</button>
   <button onclick="LSHelper.speak()">🔊 اقرأ الشرح</button>
  </div>
  <p>اكتب سؤالك أو قل لي أين توقفت:</p><input id="ls-helper-input" placeholder="مثلاً: ما معنى السؤال؟ / I don't understand" />

/* ============ AUDIO SYSTEM ============ */
const AudioSystem={
  synth:window.speechSynthesis,
  voices:[],
  englishVoice:null,
  arabicVoice:null,
  init(){
    if(!this.synth)return;
    const load=()=>{
      this.voices=this.synth.getVoices();
      const english=this.voices.filter(v=>/^en-GB/i.test(v.lang));
      const arabic=this.voices.filter(v=>/^ar/i.test(v.lang));
      this.englishVoice=english.find(v=>/Google UK English Female|Sonia|Libby|Natural/i.test(v.name))||english[0]||this.voices.find(v=>/^en/i.test(v.lang))||null;
      this.arabicVoice=arabic.find(v=>/Google|Natural|Female/i.test(v.name))||arabic[0]||null;
    };
    load();
    if(this.synth.addEventListener)this.synth.addEventListener('voiceschanged',load);
    else this.synth.onvoiceschanged=load;
  },
  speak(text,opts={}){
    if(!state.settings.narration&&!opts.force)return Promise.resolve();
    if(!this.synth)return Promise.resolve();
    return new Promise(r=>{
      try{
        this.synth.cancel();
        const u=new SpeechSynthesisUtterance(text);
        const lang=/[\u0600-\u06ff]/.test(text)?'ar':'en-GB';
        u.lang=lang;
        u.voice=lang==='ar'?this.arabicVoice:this.englishVoice;
        u.rate=opts.rate||(state.settings.slowSpeech?0.78:0.9);
        u.pitch=opts.pitch||1.1;
        u.onend=()=>r();
        u.onerror=()=>r();
        this.synth.speak(u);
      }catch(e){r();}
    });
  },
  phoneme(letter,force=false){
    const vowels={a:'the short a sound in apple',e:'the short e sound in egg',i:'the short i sound in insect',o:'the short o sound in hot',u:'the short u sound in umbrella'};
    const examples={s:'sun',t:'top',b:'ball',c:'cat',d:'dog',f:'fish',g:'goat',h:'hat',j:'jam',k:'kite',l:'leaf',m:'moon',n:'net',p:'pen',qu:'queen',r:'red',v:'van',w:'web',x:'box',y:'yes',z:'zebra',sh:'ship',ch:'chip',th:'thin'};
    const cue=vowels[letter]||`${letter==='x'?'the ending sound in':'the first sound in'} ${examples[letter]||letter}`;
    return this.speak(cue,{force});
  },
  async speakBlend(sounds,word,force=false){
    await this.speak('Listen to each sound, then blend them together.',{force});
    for(const sound of sounds)await this.phoneme(sound,force);
    await this.speak(`Now blend the sounds: ${word}.`,{force});
  },
  stop(){if(this.synth)this.synth.cancel();},
  audioCtx:null,
  getCtx(){
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return null;
    if(!this.audioCtx)this.audioCtx=new Ctx();
    return this.audioCtx;
  },
  tone(f,d,t='sine',v=0.2){
    if(!state.settings.soundEffects)return;
    try{
      const c=this.getCtx();if(!c)return;const o=c.createOscillator(),g=c.createGain();
      o.type=t;o.frequency.value=f;
      g.gain.setValueAtTime(v,c.currentTime);
      g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+d);
      o.connect(g);g.connect(c.destination);
      o.start();o.stop(c.currentTime+d);
    }catch(e){}
  },
  correct(){if(!state.settings.soundEffects)return;this.tone(523.25,.12);setTimeout(()=>this.tone(659.25,.12),100);setTimeout(()=>this.tone(783.99,.2),200);},
  incorrect(){if(!state.settings.soundEffects)return;this.tone(220,.15);setTimeout(()=>this.tone(196,.25),120);},
  click(){if(!state.settings.soundEffects)return;this.tone(800,.05,'square',0.1);},
  celebration(){if(!state.settings.soundEffects)return;[523.25,659.25,783.99,1046.50].forEach((n,i)=>setTimeout(()=>this.tone(n,.2),i*120));},
  badge(){if(!state.settings.soundEffects)return;[523.25,659.25,783.99,1046.50,1318.51].forEach((n,i)=>setTimeout(()=>this.tone(n,.25),i*100));},
};

function checkBadges(){
  const newBadges=[];
  let totalLessons=0;
  Object.values(CURRICULUM).forEach(b=>b.units.forEach(u=>u.lessons.forEach(l=>{
    if(state.progress[b.id]?.[u.id]?.[l.id]?.completed)totalLessons++;
  })));

  const check=(id,cond)=>{if(cond&&!state.badges.includes(id))newBadges.push(id);};
  check('first-lesson',totalLessons>=1);
  check('five-lessons',totalLessons>=5);
  check('ten-lessons',totalLessons>=10);
  check('twenty-lessons',totalLessons>=20);
  check('points-100',state.totalPoints>=100);

  Object.values(CURRICULUM).forEach(b=>{
    let done=0,total=0;
    b.units.forEach(u=>u.lessons.forEach(l=>{total++;if(state.progress[b.id]?.[u.id]?.[l.id]?.completed)done++;}));
    const map={'kg2-math':'all-kg2-math','kg2-english':'all-kg2-eng','g2-math':'all-g2-math','g2-english':'all-g2-eng','g2-science':'all-g2-sci'};
    if(map[b.id])check(map[b.id],done===total);
  });

  if(newBadges.length>0){
    state.badges.push(...newBadges);
    saveState();
    return newBadges.map(id=>BADGES.find(b=>b.id===id));
  }
  return [];
}

/* ============ LESSON ENGINE ============ */
let LS=null;

function renderLesson(app,{bookId,unitId,lessonIdx}){
  const book=CURRICULUM[bookId],unit=book?.units.find(x=>x.id===unitId),l=unit?.lessons[lessonIdx];
  if(!l||!getVisibleBooks().some(x=>x.id===bookId)){Router.back();return;}
  LS={bookId,unitId,lessonIdx,lesson:l,questionIdx:0,attempts:0,correct:0,charState:'idle',charMessage:"Let's begin!",answered:false,streak:0};
  drawLesson(app);
  AudioSystem.speak(l.intro||`Let's learn ${l.title}.`);
}

function drawLesson(app){
  if(!app)app=document.getElementById('app');
  const{lesson,questionIdx,charState,charMessage}=LS;
  const total=getLessonTotal(lesson);
  const progress=(questionIdx/total)*100;
  app.innerHTML=topbar(lesson.title)+`
    <div class="screen"><div class="lesson-container">
      <div class="lesson-header">
        <div class="lesson-title">${lesson.title}</div>
        <div class="lesson-goal">🎯 ${lesson.objective}</div>
      </div>
      <div class="lesson-progress"><div class="lesson-progress-fill" style="width:${progress}%"></div></div>
      ${character(charState,charMessage)}
      <div class="activity-area" id="activity-area"></div>
    </div></div>`;
  renderActivity();
}

function getLessonTotal(l){
  if(l.questions)return l.questions.length;
  if(l.words)return l.words.length;
  if(l.items)return l.items.length;
  return 0;
}

function renderActivity(){
  const{lesson,questionIdx}=LS;
  const total=getLessonTotal(lesson);
  if(questionIdx>=total){finishLesson();return;}
  const q=lesson.questions?lesson.questions[questionIdx]:null;
  const area=document.getElementById('activity-area');
  LS.answered=false;LS.attempts=0;
  switch(lesson.type){
    case 'counting':renderCounting(area,q);break;
    case 'match-quantity':renderMatchQty(area,q);break;
    case 'sequence':renderSequence(area,q);break;
    case 'shape-match':renderShape(area,q);break;
    case 'compare':renderCompare(area,q);break;
    case 'phonics':renderPhonics(area,lesson);break;
    case 'listen-choose':renderListen(area,q);break;
    case 'rhyme':renderRhyme(area,q);break;
    case 'story':renderStory(area,lesson,questionIdx);break;
    case 'fill-gap':renderGap(area,q);break;
    case 'sentence-build':renderSentence(area,q);break;
    case 'arithmetic':renderArith(area,q,lesson.op);break;
    case 'place-value':renderPV(area,q);break;
    case 'word-problem':renderWP(area,q);break;
    case 'classify':renderClassify(area,q);break;
    case 'mcq':renderMCQ(area,q);break;
    case 'pattern':renderPattern(area,q);break;
    case 'sort':renderSort(area,lesson);break;
    case 'counting-add':renderCountingAdd(area,q);break;
    case 'word-picture':renderWordPicture(area,q);break;
    case 'blend':renderBlend(area,q);break;
    case 'sentence-picture':renderSentencePicture(area,q);break;
    case 'classify-word':renderClassifyWord(area,lesson);break;
    case 'compare-numbers':renderCompareNumbers(area,q);break;
    default:area.innerHTML='<p>Activity type not implemented.</p>';
  }
}

/* ============ FEEDBACK & PROGRESSION ============ */
const praise=['Brilliant!','Wonderful!','Well done!','Fantastic!','Great work!','You did it!','Super!','Amazing!'];
const enc=['Good try!','Nearly!',"Let's try again.",'You can do this!','Keep going!'];

function handleCorrect(msg){
  const lessonRun=LS;
  LS.answered=true;LS.correct++;LS.streak++;
  LS.charState='happy';
  LS.charMessage=msg||praise[Math.floor(Math.random()*praise.length)];
  AudioSystem.correct();
  AudioSystem.speak(LS.charMessage);
  confetti();

  const{bookId,unitId,lesson}=LS;
  if(!state.progress[bookId])state.progress[bookId]={};
  if(!state.progress[bookId][unitId])state.progress[bookId][unitId]={};
  const lp=state.progress[bookId][unitId][lesson.id]=state.progress[bookId][unitId][lesson.id]||{completed:false,correct:0,attempts:0,mastery:'learning'};
  lp.correct++;lp.attempts++;lp.lastSeen=Date.now();
  state.totalPoints+=10;
  saveState();

  // Check streak badge
  if(LS.streak===3&&!state.badges.includes('streak-3')){
    state.badges.push('streak-3');
    saveState();
    setTimeout(()=>{
      AudioSystem.badge();
      alert('🏆 Badge earned: On Fire! (3 correct in a row)');
    },1500);
  }

  const total=getLessonTotal(LS.lesson);
  setTimeout(()=>{
    if(LS!==lessonRun||Router.current!=='lesson')return;
    LS.questionIdx++;
    LS.charState='idle';
    LS.charMessage=LS.questionIdx>=total?'Lesson complete!':'Next!';
    drawLesson(document.getElementById('app'));
  },1800);
}

function handleIncorrect(msg,hint){
  const lessonRun=LS;
  LS.attempts++;LS.streak=0;
  LS.charState=LS.attempts>=2?'encouraging':'thinking';
  LS.charMessage=msg||enc[Math.floor(Math.random()*enc.length)];
  AudioSystem.incorrect();

  const{bookId,unitId,lesson}=LS;
  if(!state.progress[bookId])state.progress[bookId]={};
  if(!state.progress[bookId][unitId])state.progress[bookId][unitId]={};
  const lp=state.progress[bookId][unitId][lesson.id]=state.progress[bookId][unitId][lesson.id]||{completed:false,correct:0,attempts:0,mastery:'learning'};
  lp.attempts++;saveState();

  const fb=document.getElementById('fb');
  if(fb)fb.innerHTML=`<div class="feedback incorrect">${msg}</div>`;
  const cw=document.querySelector('.character-wrap');
  if(cw)cw.outerHTML=character(LS.charState,LS.charMessage);

  if(LS.attempts>=2&&hint){
    setTimeout(()=>{
      if(LS!==lessonRun||Router.current!=='lesson')return;
      const f=document.getElementById('fb');
      if(f)f.innerHTML+=`<div class="feedback hint">💡 ${hint}</div>`;
      AudioSystem.speak('Hint. '+hint);
    },1500);
  }

  if(LS.attempts>=3){
    setTimeout(()=>{
      if(LS!==lessonRun||Router.current!=='lesson')return;
      const q=LS.lesson.questions?LS.lesson.questions[LS.questionIdx]:LS.lesson.items?LS.lesson.items[LS.questionIdx]:null;
      const a=q?(q.answer!==undefined?q.answer:(q.target||q.picture||'')):'';
      const f=document.getElementById('fb');
      if(f)f.innerHTML+=`<div class="feedback hint">The answer was: <strong>${a}</strong>. Next!</div>`;
      LS.answered=true;
      setTimeout(()=>{
        if(LS!==lessonRun||Router.current!=='lesson')return;
        LS.questionIdx++;LS.charState='idle';LS.charMessage="Let's keep going!";
        drawLesson(document.getElementById('app'));
      },2500);
    },2500);
  }else{
    setTimeout(()=>{if(LS===lessonRun&&Router.current==='lesson')LS.answered=false;},1500);
  }
}

function finishLesson(){
  const{bookId,unitId,lesson,correct}=LS;
  const total=getLessonTotal(lesson);
  const pct=Math.round(correct/total*100);

  if(!state.progress[bookId])state.progress[bookId]={};
  if(!state.progress[bookId][unitId])state.progress[bookId][unitId]={};
  const lp=state.progress[bookId][unitId][lesson.id]=state.progress[bookId][unitId][lesson.id]||{completed:false,correct:0,attempts:0,mastery:'learning'};
  lp.completed=true;
  lp.mastery=pct>=80?'mastered':pct>=50?'practising':'learning';
  state.totalPoints+=20;
  saveState();

  AudioSystem.celebration();
  confetti();

  // Check perfect score badge
  if(pct===100&&!state.badges.includes('perfect-score')){
    state.badges.push('perfect-score');
    saveState();
  }

  // Check all badges
  const newBadges=checkBadges();

  const b=CURRICULUM[bookId],u=b.units.find(x=>x.id===unitId);
  const nli=LS.lessonIdx+1,hnl=nli<u.lessons.length;
  const nui=b.units.findIndex(x=>x.id===unitId)+1,hnu=nui<b.units.length;

  document.getElementById('app').innerHTML=topbar('Well done!')+`
    <div class="screen"><div class="lesson-container" style="text-align:center">
      ${character('celebrating','You finished!')}
      <h2 style="color:var(--primary-dark);margin:16px 0">🌟 Brilliant work! 🌟</h2>
      <div style="background:#fff;border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);margin:16px 0">
        <div style="font-size:1.2rem;font-weight:700;margin-bottom:8px">${lesson.title}</div>
        <div style="font-size:3rem;color:var(--success);font-weight:700">${correct}/${total}</div>
        <div style="color:var(--text-light)">correct answers</div>
        <div style="margin-top:12px;font-size:1.1rem;color:var(--primary-dark);font-weight:600">
          ${pct>=80?'⭐ Mastered!':pct>=50?'👍 Good progress':'📚 Keep practising'}
        </div>
        <div style="margin-top:8px;color:var(--secondary);font-weight:600">+${20+correct*10} points</div>
      </div>
      ${newBadges.length>0?`
        <div style="background:linear-gradient(135deg,#FFF8DC,#FFE8A0);border-radius:var(--radius);padding:16px;margin:12px 0;border:2px solid var(--secondary)">
          <div style="font-size:1.2rem;font-weight:700;color:var(--primary-dark);margin-bottom:8px">🏆 New Badge${newBadges.length>1?'s':''}!</div>
          ${newBadges.map(b=>`<div style="font-size:2rem">${b.icon} ${b.name}</div>`).join('')}
        </div>
      `:''}
      <div class="btn-row">
        <button class="btn ghost" onclick="Router.go('book',{bookId:'${bookId}'})">Back to units</button>
        ${hnl?`<button class="btn success" onclick="Router.go('lesson',{bookId:'${bookId}',unitId:'${unitId}',lessonIdx:${nli}})">Next lesson →</button>`:''}
        ${!hnl&&hnu?`<button class="btn success" onclick="Router.go('lesson',{bookId:'${bookId}',unitId:'${b.units[nui].id}',lessonIdx:0})">Next unit →</button>`:''}
      </div>
    </div></div>`;

  AudioSystem.speak(pct>=80?'Wonderful work! You mastered this.':'Good effort! Let\'s practise more.');
}

function timeoutSignal(ms){
  if(typeof AbortSignal!=='undefined'&&typeof AbortSignal.timeout==='function')return AbortSignal.timeout(ms);
  if(typeof AbortController==='undefined')return undefined;
  const controller=new AbortController();setTimeout(()=>controller.abort(),ms);return controller.signal;
}
async function requestGemini(question,context=null){
  if(!geminiApiKey)throw new Error('Save a Gemini API key in Parent settings first.');
  const model=String(aiPrefs.geminiModel||defaultAIPrefs.geminiModel).trim();
  const contextText=context?`Lesson: ${context.lessonTitle}. Subject: ${context.subject}. Goal: ${context.objective}. Activity: ${context.activityPrompt}. Current question: ${context.question}.\nLearner's message: ${question}`:question;
  const response=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(model)}:generateContent`,{
    method:'POST',headers:{'Content-Type':'application/json','x-goog-api-key':geminiApiKey},signal:timeoutSignal(25000),
    body:JSON.stringify({systemInstruction:{parts:[{text:'You are a kind, encouraging tutor for a young child. Give a short, simple hint and explain one small step. Do not reveal the direct answer to a homework question. Reply in the language the learner used.'}]},contents:[{role:'user',parts:[{text:contextText}]}],generationConfig:{temperature:0.35,maxOutputTokens:240}})
  });
  let data={};try{data=await response.json();}catch(e){}
  if(!response.ok)throw new Error(data?.error?.message||`Gemini request failed (${response.status}).`);
  const answer=(data.candidates?.[0]?.content?.parts||[]).map(part=>part.text||'').join('\n').trim();
  if(!answer)throw new Error(data.promptFeedback?.blockReason||'Gemini did not return an answer.');
  return answer;
}

   return 'فهمت أنك تحتاج مساعدة. أستطيع إعطاء تلميح عام: اقرأ السؤال مرة أخرى، وحدد الكلمات المهمة، ثم جرّب خطوة صغيرة. استخدم زر «اشرح لي بالعربي» لشرح الدرس الحالي.';
  },
  async reply(){
   const input=document.getElementById('ls-helper-input'),v=(input.value||'').trim();
   const answer=document.getElementById('ls-helper-answer');
   if(!v){this.last=this.localReply('');answer.textContent=this.last;return;}
    if(aiPrefs.onlineEnabled&&geminiApiKey&&navigator.onLine){
    answer.textContent='لحظة، أفكر في تلميح مناسب…';
    try{
     const result=await askOnlineAssistant(v);this.last=result.answer;answer.textContent=this.last;
      updateHelperMode();input.value='';return;
    }catch(e){this.last=this.localReply(v);answer.textContent=`تعذر المساعد المتصل الآن؛ نكمل بالمساعد المحلي.\n${this.last}`;const mode=document.getElementById('ls-helper-mode');if(mode)mode.textContent='المساعد المتصل غير متاح الآن. المساعد المحلي ما زال يعمل.';input.value='';return;}
   }
   this.last=this.localReply(v);
   if(aiPrefs.onlineEnabled&&!navigator.onLine)answer.textContent=`الإنترنت غير متاح؛ نكمل محليًا.\n${this.last}`;
    else if(aiPrefs.onlineEnabled&&!geminiApiKey)answer.textContent=`أضف مفتاح Gemini من إعدادات وليّ الأمر؛ نكمل الآن بالمساعد المحلي.\n${this.last}`;
   else answer.textContent=this.last;
   input.value='';updateHelperMode();
  },
};
window.addEventListener('online',updateHelperMode);window.addEventListener('offline',updateHelperMode);

</script>
