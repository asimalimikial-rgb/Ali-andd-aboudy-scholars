plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

def releaseStorePath = System.getenv('ANDROID_KEYSTORE_PATH')
def releaseStorePassword = System.getenv('ANDROID_KEYSTORE_PASSWORD')
def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
def releaseKeyPassword = System.getenv('ANDROID_KEY_PASSWORD')
def hasReleaseSigning = releaseStorePath && file(releaseStorePath).isFile() && releaseStorePassword && releaseKeyAlias && releaseKeyPassword

android {
    namespace 'com.alialiaboudyscholars.app'
    compileSdk 35

    defaultConfig {
        applicationId 'com.alialiaboudyscholars.app'
        minSdk 23
        targetSdk 35
        versionCode 9
        versionName '1.3.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
        // Pull-request builds are isolated beta installs; they never replace the stable app.
        if (System.getenv('GITHUB_EVENT_NAME') == 'pull_request') {
            applicationIdSuffix '.beta'
            versionNameSuffix '-beta.1'
        }
    }

    androidResources { noCompress += ['onnx', 'bin'] }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(releaseStorePath)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                // Local builds without signing secrets remain installable for testing.
                signingConfig signingConfigs.debug
            }
            minifyEnabled false
            shrinkResources false
        }
    }
}
