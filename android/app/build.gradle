plugins { id 'com.android.application' }

android {
    namespace 'com.alialiaboudyscholars.app'
    compileSdk 35

    defaultConfig {
        // Separate package keeps the existing installed app and its data untouched.
        applicationId 'com.alialiaboudyscholars.app.preview'
        minSdk 23
        targetSdk 35
        versionCode 5
        versionName '1.2.2-preview'
    }

    buildTypes {
        release {
            // Device-test build only; intentionally not signed with the production keystore.
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}
