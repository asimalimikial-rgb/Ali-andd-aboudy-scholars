<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Temporary TTS API Smoke Test</title>
<style>
body{font:16px system-ui,sans-serif;max-width:760px;margin:32px auto;padding:0 16px;color:#172033}
button{padding:12px 18px;margin:8px 8px 8px 0;border:0;border-radius:10px;background:#2457a7;color:white;font-weight:600}
pre{white-space:pre-wrap;background:#f2f4f8;padding:14px;border-radius:10px;min-height:100px}
audio{display:block;width:100%;margin:12px 0}
</style>
</head>
<body>
<h1>Temporary TTS API Smoke Test</h1>
<p>Generic test phrases only. This page sends no child names, learning profiles, or progress.</p>
<button id="en">Test English</button>
<button id="ar">اختبار العربية</button>
<pre id="result" aria-live="polite">Ready.</pre>
<audio id="player" controls></audio>
<script>
const result=document.getElementById('result');
const player=document.getElementById('player');
async function test(language,text,voice){
  result.textContent='Requesting '+language+' audio…';
  player.pause();player.removeAttribute('src');player.load();
  try{
    const response=await fetch('/api/tts',{
      method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text,voice,language})
    });
    const blob=await response.blob();
    const bytes=new Uint8Array(await blob.slice(0,12).arrayBuffer());
    const ascii=Array.from(bytes).map(x=>String.fromCharCode(x)).join('');
    const isWav=ascii.slice(0,4)==='RIFF'&&ascii.slice(8,12)==='WAVE';
    result.textContent=[
      'HTTP status: '+response.status,
      'Content-Type: '+(response.headers.get('content-type')||'not provided'),
      'Bytes: '+blob.size,
      'RIFF/WAVE header: '+(isWav?'valid':'not detected'),
      'First 12 bytes (ASCII): '+JSON.stringify(ascii)
    ].join('\n');
    if(response.ok&&blob.size&&isWav){
      player.src=URL.createObjectURL(blob);
      await player.play().catch(()=>{});
      result.textContent+='\nAudio player loaded. Press play if autoplay is blocked.';
    }
  }catch(error){result.textContent='Request failed: '+String(error&&error.message||error);}
}
document.getElementById('en').onclick=()=>test('en-GB','Hello, this is a short service test.','Puck');
document.getElementById('ar').onclick=()=>test('ar-XA','هذا اختبار قصير لخدمة تحويل النص إلى كلام.','Kore');
</script>
</body>
</html>
