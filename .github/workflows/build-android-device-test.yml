name: Build Android device-test APK

on:
  push:
    branches: [android-device-test]
    paths:
      - 'index.html'
      - 'android/**'
      - '.github/workflows/build-android-device-test.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: 'platform-tools,platforms;android-35,build-tools;35.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Package current web app and native speech bridge
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cat > android/app/src/main/assets/tts-config.js <<'EOF'
          // Preview API is protected by Vercel SSO. Android Native TTS is the fallback.
          window.ALI_TTS_API_BASE = 'https://ali-andd-aboudy-scholars-jf83-4aaz83rxl-mikial.vercel.app/api/tts';
          EOF
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/assets/index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<script src="tts-config.js"></script>'
          if marker not in s:
              raise SystemExit('Expected tts-config.js insertion point was not found')
          s = s.replace(marker, marker + '\n  <script src="tts-bridge.js"></script>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Build installable preview APK
        run: gradle --no-daemon --stacktrace -p android :app:assembleRelease
      - name: Prepare artifact and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Ali-Aboudy-Scholars-1.2.2-preview.apk
          sha256sum dist/Ali-Aboudy-Scholars-1.2.2-preview.apk | tee dist/SHA256SUMS.txt
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ali-Aboudy-Scholars-1.2.2-preview-APK
          path: |
            dist/Ali-Aboudy-Scholars-1.2.2-preview.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
