name: Build and publish Ali & Aboudy Scholars APK

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tts-config.android.js'
      - 'api/**'
      - 'android/**'
      - 'scripts/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare packaged web app and voice endpoint
        shell: bash
        run: |
          mkdir -p android/app/src/main/assets
          cp index.html android/app/src/main/assets/index.html
          cp tts-config.android.js android/app/src/main/assets/tts-config.js

      - name: Validate JavaScript
        run: |
          node scripts/check-html.mjs
          node scripts/check-phonics-wordstudy.mjs
          node --check api/tts.js

      - name: Decode release signing key
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ali-aboudy-release-key.jks"
          test -s "$RUNNER_TEMP/ali-aboudy-release-key.jks"
          chmod 600 "$RUNNER_TEMP/ali-aboudy-release-key.jks"

      - name: Build Android APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ali-aboudy-release-key.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle --no-daemon --stacktrace -p android :app:assembleRelease

      - name: Verify release signing certificate
        shell: bash
        run: |
          APK=android/app/build/outputs/apk/release/app-release.apk
          SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          DIGEST=$("$SIGNER" verify --print-certs "$APK" | awk -F': ' '/Signer #1 certificate SHA-256 digest/ {print tolower($2); exit}' | tr -d ':')
          EXPECTED=00c86a79b851f848a20203a74d07397ff67eb09182a614609c20e17d603408e1
          test "$DIGEST" = "$EXPECTED" || { echo "Release signer mismatch; refusing to publish."; exit 1; }

      - name: Name APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk dist/Ali-Aboudy-Scholars-v1.2.3.apk
          sha256sum dist/Ali-Aboudy-Scholars-v1.2.3.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Ali-Aboudy-Scholars-v1.2.3
          path: dist/Ali-Aboudy-Scholars-v1.2.3.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.3
          target_commitish: ${{ github.sha }}
          name: Ali & Aboudy Scholars v1.2.3
          body_path: CHANGELOG.md
          files: dist/Ali-Aboudy-Scholars-v1.2.3.apk
          overwrite_files: true
          make_latest: true
